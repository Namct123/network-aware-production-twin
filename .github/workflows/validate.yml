name: Validate focused monitoring study
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: production-twin-dt:candidate-ci-monitoring
    steps:
      - uses: actions/checkout@v7
      - name: Check delivery boundary and build focused candidate
        run: |
          python3 docker/test_delivery.py
          python3 docker/build_image.py --scope monitoring --tag candidate-ci-monitoring
          mkdir -p output/docker
          chmod a+rwx output/docker
      - name: Check event kernel, predictors and evidence gates
        run: docker run --rm --network none --read-only "$IMAGE"
      - name: Reproduce normal segments and monitoring case study
        run: |
          docker run --rm --network none --read-only -v "$PWD/output/docker:/app/output" "$IMAGE" mujoco/study_eta_ml.py --output /app/output/ci_ml
          docker run --rm --network none --read-only -v "$PWD/output/docker:/app/output" "$IMAGE" mujoco/study_eta_monitor.py --source /app/output/ci_ml --output /app/output/ci_monitor
          python3 -c "import json; from pathlib import Path; actual=json.loads(Path('output/docker/ci_monitor/results.json').read_text()); expected=json.loads(Path('docker/evidence/candidate-20261106-eta-monitor-v2.json').read_text())['study']; assert actual==expected"
      - name: Reproduce fixed fresh-condition clock and age-gate study
        run: |
          docker run --rm --network none --read-only -v "$PWD/output/docker:/app/output" "$IMAGE" mujoco/study_network_clock.py --output /app/output/ci_clock
          python3 -c "import json; from pathlib import Path; actual=json.loads(Path('output/docker/ci_clock/results.json').read_text()); actual.pop('runs'); expected=json.loads(Path('docker/evidence/candidate-20261106-network-clock.json').read_text())['study']; assert actual==expected"
      - name: Reproduce evaluator-only sampling and motion-model audit
        run: |
          docker run --rm --network none --read-only -v "$PWD/output/docker:/app/output" "$IMAGE" mujoco/audit_pulse_model.py --source /app/output/ci_clock --output /app/output/ci_pulse_audit
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          actual=json.loads(Path('output/docker/ci_pulse_audit/results.json').read_text())
          expected=json.loads(Path('docker/evidence/candidate-20261106-pulse-model-audit.json').read_text())['audit']
          def matches(a,b):
              if isinstance(a,float) and isinstance(b,(int,float)): return math.isclose(a,b,rel_tol=1e-9,abs_tol=1e-10)
              if isinstance(a,dict): return isinstance(b,dict) and a.keys()==b.keys() and all(matches(a[k],b[k]) for k in a)
              if isinstance(a,list): return isinstance(b,list) and len(a)==len(b) and all(matches(x,y) for x,y in zip(a,b))
              return a==b
          assert matches(actual,expected)
          PY
      - name: Reproduce paired contact and startup diagnostic
        run: |
          docker run --rm --network none --read-only -v "$PWD/output/docker:/app/output" "$IMAGE" mujoco/study_contact_startup.py --source /app/output/ci_clock --output /app/output/ci_contact
          python3 - <<'PY'
          import json, math
          from pathlib import Path
          actual=json.loads(Path('output/docker/ci_contact/results.json').read_text())
          expected=json.loads(Path('docker/evidence/candidate-20261106-contact-startup-v2.json').read_text())['study']
          def matches(a,b):
              if isinstance(a,float) and isinstance(b,(int,float)): return math.isclose(a,b,rel_tol=1e-9,abs_tol=1e-10)
              if isinstance(a,dict): return isinstance(b,dict) and a.keys()==b.keys() and all(matches(a[k],b[k]) for k in a)
              if isinstance(a,list): return isinstance(b,list) and len(a)==len(b) and all(matches(x,y) for x,y in zip(a,b))
              return a==b
          assert matches(actual,expected)
          PY
      - name: Preserve virtual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitoring-study-evidence
          path: output/docker/
          if-no-files-found: ignore
