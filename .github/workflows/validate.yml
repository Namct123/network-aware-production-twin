name: Validate focused monitoring study
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  monitoring:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      IMAGE: production-twin-dt:candidate-ci-monitoring
    steps:
      - uses: actions/checkout@v7
      - name: Check delivery boundary and build focused candidate
        run: |
          python3 docker/test_delivery.py
          python3 docker/build_image.py --scope monitoring --tag candidate-ci-monitoring
          mkdir -p output/docker
          chmod a+rwx output/docker
      - name: Check event kernel, predictors and evidence gates
        run: docker run --rm --network none --read-only "$IMAGE"
      - name: Reproduce normal segments and monitoring case study
        run: |
          docker run --rm --network none --read-only -v "$PWD/output/docker:/app/output" "$IMAGE" mujoco/study_eta_ml.py --output /app/output/ci_ml
          docker run --rm --network none --read-only -v "$PWD/output/docker:/app/output" "$IMAGE" mujoco/study_eta_monitor.py --source /app/output/ci_ml --output /app/output/ci_monitor
          python3 -c "import json; from pathlib import Path; actual=json.loads(Path('output/docker/ci_monitor/results.json').read_text()); expected=json.loads(Path('docker/evidence/candidate-20261106-eta-monitor-v2.json').read_text())['study']; assert actual==expected"
      - name: Preserve virtual evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: monitoring-study-evidence
          path: output/docker/
          if-no-files-found: ignore
